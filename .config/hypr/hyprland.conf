#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 7

    border_size = 3

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = 0xff669466 0xff669466 0deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
    #layout = master
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.7

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 12
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = stream, 0.4, 0.0, 0.4, 1.0
    bezier = cascade, 0.19, 1.0, 0.22, 1.0
    bezier = water, 0.22, 0.9, 0.36, 1.0
    bezier = flow, 0.25, 0.1, 0.25, 1.0

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows,    1, 3.0, water
    animation = windowsIn,  1, 2.5, cascade,slide
    animation = windowsOut, 1, 2.4, stream,slide
    animation = windowsMove,1, 1.6, flow
    # animation = windows, 1, 4.79, easeOutQuint
    # animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    # animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    middle_click_paste = false
    #focus_on_activate = true

}


#############
### INPUT ###
#############
    
# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout  = us,latam
    kb_variant = 
    kb_model =
    kb_options =grp:win_space_toggle
    kb_rules =
 
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    name = razer-razer-deathadder-v2
    sensitivity = 0
    accel_profile = flat
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gesture= 3, horizontal, workspace
gesture= 4, down, close
gesture= 4, up, dispatcher, exec, $menu
gesture= 3, pinch, resize


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier


# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more


#CLIPBOARD
$clipboard2 = vicinae vicinae://extensions/vicinae/clipboard/history
bind = $mainMod, V, exec, $clipboard2


#SCREENSHOTS HYPRSHOT + SATTY
bind = $mainMod, PRINT, exec, ~/.config/hypr/scripts/sswindow.sh
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/ssregion.sh
bind = , PRINT, exec, ~/.config/hypr/scripts/ssfullscreen.sh

#INSERT WORKSPACE
bind = $mainMod, return, exec, ~/.config/hypr/scripts/shiftwork.sh

##MOVE WINDOWS
bind=$mainMod,M, togglefloating
bind=$mainMod,M, pin
bind=$mainMod,M, resizeactive, exact 600 600

#### FULLSCREEN
bind=$mainMod,F,fullscreen
####PANEL NOTIS
bind = $mainMod, N, exec, swaync-client -t -sw
####HYPRLOCK
bind = $mainMod, L, exec, hyprlock

bind = $mainMod, S, swapnext
bind = $mainMod, T, exec, $terminal
bind = $mainMod, K, killactive,
bind = $mainMod SHIFT, E, exec, $file2
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, TAB, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, H, togglesplit, # dwindle

####SHOW TAB WINDOWS
bind = ALT, TAB, exec, vicinae vicinae://extensions/vicinae/wm/switch-windows 
####SHOW EMOJIS
bind = $mainMod, period, exec, vicinae vicinae://extensions/vicinae/core/search-emojis

# Resizing
binde = ALT, left, resizeactive, -25 0
binde = ALT, right, resizeactive, 25 0
binde = ALT, up, resizeactive, 0 -25
binde = ALT, down, resizeactive, 0 25

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scroll through existing workspaces with mainMod + pgkeys
bind = $mainMod, page_down, workspace, e-1
bind = $mainMod, page_up, workspace, e+1


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = alt, mouse:272, resizewindow


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightnessup.sh
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightnessdown.sh

bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volumeraise.sh
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volumelower.sh
bindel = , XF86AudioMute, exec, ~/.config/hypr/scripts/volumemute.sh


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# # Example windowrule
#
# # Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*
#
# # Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
#

####Windows rules 
windowrule = match:class firefox, opacity 1.0 override
windowrule = match:class Code, opacity 0.9 override
windowrule = match:class chromium, opacity 1.0 override
windowrule = match:class Spotify, workspace 6, opacity 0.8 override
windowrule = match:class org.gnome.Nautilus, opacity 0.8 override
windowrule = match:class discord, workspace 5 silent
windowrule = match:class com.gabm.satty, size 1000 700
windowrule = match:class steam, workspace 5
windowrule = match:class com.obsproject.Studio, workspace 8
windowrule = match:class org.gnome.Calendar, float on
windowrule = match:class org.gnome.Loupe, float on
windowrule = match:class org.gnome.Showtime, float on
windowrule = match:class org.pulseaudio.pavucontrol, size 911 508, float on
windowrule = match:class blueman-manager, float on
windowrule = match:class firefox, no_screen_share on
windowrule = match:initial_title Lista de amigos, float on, size 363 733

xwayland {
  force_zero_scaling = true
}

input {
    numlock_by_default = true
}
